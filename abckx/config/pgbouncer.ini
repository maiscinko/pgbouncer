[databases]
# Default connection for all databases
* = host=projeto-supabase.supabase.co port=5432 dbname=postgres

# Conexões específicas por módulo (opcional)
hub = host=projeto-supabase.supabase.co port=5432 dbname=postgres
login = host=projeto-supabase.supabase.co port=5432 dbname=postgres
crm = host=projeto-supabase.supabase.co port=5432 dbname=postgres
erp = host=projeto-supabase.supabase.co port=5432 dbname=postgres

[pgbouncer]
# Configurações de escuta
listen_addr = 0.0.0.0
listen_port = 6432

# Autenticação
auth_type = md5
auth_file = /etc/pgbouncer/users.txt
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

# Pool
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 5
max_db_connections = 50
max_user_connections = 50

# Timeouts
query_timeout = 0
query_wait_timeout = 120
client_idle_timeout = 0
client_login_timeout = 60
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15

# Logs
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60

# Admin Console
admin_users = admin
stats_users = stats, prometheus

# Ajustes de desempenho
tcp_keepalive = 1
tcp_keepcnt = 3
tcp_keepidle = 30
tcp_keepintvl = 15